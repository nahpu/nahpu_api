[package]
name = "nahpu_dwc"
version = "0.9.0"
edition = "2024"
authors = ["Heru Handika <herubiolog@gmail.com>"]
homepage = "https://www.nahpu.app/"
description = "A utility crate for mapping and converting Nahpu project data into Darwin Core JSON format."
repository = "https://github.com/hhandika/nahpu_api"
license = "MIT"
keywords = ["nahpu", "darwin-core", "dwc", "biodiversity"]
categories = ["data-structures", "science"]
readme = "README.md"

[dependencies]
csv = "1.4.0"
quick-xml = "0.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = "9.4.1"
nahpu_db = { version = "0.7.0", path = "../nahpu_db" }
nahpu_archive = { version = "0.3.2", path = "../nahpu_archive" }

[dev-dependencies]
sqlparser = "0.63"
tempfile = "3.27"

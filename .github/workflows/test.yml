name: Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  schema-parity:
    name: Schema parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nahpu_api
        uses: actions/checkout@v6

      - name: Resolve NAHPU ref
        id: counterpart
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
          TARGET_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          COUNTERPART_URL: https://github.com/nahpu/nahpu.git
        run: |
          for ref in "$CANDIDATE_REF" "$TARGET_REF" main; do
            if [[ -n "$ref" ]] && git ls-remote --exit-code --heads \
              "$COUNTERPART_URL" "refs/heads/$ref" >/dev/null 2>&1; then
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No matching NAHPU branch found."
          exit 1

      - name: Checkout NAHPU
        uses: actions/checkout@v6
        with:
          repository: nahpu/nahpu
          ref: ${{ steps.counterpart.outputs.ref }}
          path: counterpart

      - name: Compare database schemas
        run: |
          diff --unified \
            --label nahpu/lib/services/database/tables.drift \
            --label nahpu_api/crates/nahpu_db/schema/tables.drift \
            counterpart/lib/services/database/tables.drift \
            crates/nahpu_db/schema/tables.drift

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build Workspace
        run: cargo build --verbose --workspace

      - name: Run Tests
        run: cargo test --verbose --workspace
